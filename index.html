<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF8F4">
<title>Prostor Upoznaj Sebe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{
  --iv:#FAF8F4; --wh:#FFFFFF; --wg:#F2EDE6; --st:#E4DCD2; --pl:#3D2440;
  --go:#B8965A; --ink:#1E1A18; --tx:#3A322C; --mu:#6F6357; --bd:#E0D5C8;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--iv);color:var(--tx);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--pl)}
img{display:block;max-width:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}

.ekran{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:110px;position:relative;animation:pojava .5s ease}
@keyframes pojava{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.okvir{padding:0 24px}

.logo{font-family:var(--serif);font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--pl);text-decoration:none}
.zaglavlje{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 0;min-height:66px}
.malo-dugme{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);text-decoration:none;background:none;border:0;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}

.nadnaslov{display:flex;align-items:center;gap:12px;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--mu)}
.nadnaslov::before{content:'';width:28px;height:1px;background:var(--go);flex:none}
h1,.h1{font-family:var(--serif);font-weight:300;color:var(--ink);line-height:1.05;font-size:46px}
h1 em,.h1 em,h2 em{font-style:italic}
h2{font-family:var(--serif);font-weight:300;color:var(--ink);font-size:30px;line-height:1.1}
.tekst{font-size:15px;line-height:1.8;color:var(--tx)}
.tiho{font-size:12.5px;color:var(--mu)}

.dugme{display:block;width:100%;text-align:center;background:var(--pl);color:#fff;border:0;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding:18px 0;text-decoration:none;cursor:pointer;min-height:48px}
.dugme:hover{background:#2c1830}
.dugme.obrub{background:transparent;color:var(--pl);border:1px solid var(--pl)}
.dugme.obrub:hover{background:var(--pl);color:#fff}
.tihi-link{display:flex;justify-content:center;align-items:center;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);text-decoration:none;min-height:44px;background:none;border:0;cursor:pointer;width:100%}

.naslovna{position:relative;overflow:hidden;background:var(--st)}
.naslovna img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.naslovna .sloj{position:absolute;inset:0;background:rgba(20,15,12,.16)}
.naslovna .natpis{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:6px}
.naslovna .natpis .k{font-family:var(--serif);font-weight:500;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase}
.naslovna .natpis .a{font-family:var(--serif);letter-spacing:.06em;text-transform:uppercase;line-height:1}

.kartica{background:var(--wh)}
.linija{height:1px;background:var(--bd)}
.napredak{height:1px;background:var(--bd);margin:4px 0 8px}
.napredak span{display:block;height:1px;background:var(--go)}

.prostorija{display:flex;align-items:center;gap:16px;padding:12px;background:var(--wh);text-decoration:none;color:var(--ink);min-height:44px}
.prostorija img{width:76px;height:76px;object-fit:cover;flex:none}
.prostorija .ime{font-family:var(--serif);font-size:23px;line-height:1.1;display:block}

.red{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--bd);text-decoration:none;color:var(--ink);min-height:44px}
.red .broj{font-family:var(--serif);font-style:italic;font-size:20px;width:40px;flex:none;color:var(--mu);align-self:flex-start;padding-top:1px}
.red .naziv{font-family:var(--serif);font-size:21px;line-height:1.15;display:block}
.red .pod{font-size:12.5px;line-height:1.5;color:var(--mu);display:block}
.red .status{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);display:block;margin-top:2px}
.red.ovde .broj{color:var(--go)} .red.ovde .naziv{font-weight:500} .red.ovde .status{color:var(--pl)}
.strelica{flex:none;color:var(--mu)}

.mreza3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.plocica{background:var(--wh);padding:16px 12px;font-family:var(--serif);font-size:17px;line-height:1.2;color:var(--ink);text-decoration:none;min-height:80px;display:block}
.plocica small{display:block;font-family:var(--sans);font-size:11px;color:var(--mu);margin-top:6px;line-height:1.4}

/* pauza */
.pauza{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:36px 28px;text-align:center;max-width:520px;margin:0 auto}
.krug-okvir{width:190px;height:190px;display:flex;align-items:center;justify-content:center}
.krug{width:190px;height:190px;border-radius:50%;border:1px solid var(--go);animation:dah 10s ease-in-out infinite}
@keyframes dah{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1);opacity:1}}

.video{position:relative;aspect-ratio:16/9;background:#2a2522;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .prazno{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:20px}
.video img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}

.pismo{background:var(--wh);padding:26px 24px;display:flex;flex-direction:column;gap:16px}
.pismo .glava{display:flex;align-items:center;gap:14px}
.pismo .glava img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:center 18%}
.potpis{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--pl)}
.trebalo{background:var(--wg);padding:30px 24px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.trebalo .recenica{font-family:var(--serif);font-style:italic;font-weight:300;font-size:28px;line-height:1.3;color:var(--ink)}

/* dnevnik */
.stranica{background:var(--wh);padding:26px 22px 18px;border-top:1px solid var(--go);display:flex;flex-direction:column;gap:12px}
.stranica .datum{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink)}
.stranica textarea{width:100%;min-height:352px;border:0;outline:0;resize:vertical;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--bd) 31px,var(--bd) 32px);font-family:var(--serif);font-size:19px;line-height:32px;color:var(--ink)}
.stranica textarea::placeholder{color:var(--mu)}
.unos{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:16px 0;cursor:pointer;min-height:44px}
.unos .d{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink);display:block}
.unos .t{font-size:13.5px;line-height:1.6;color:var(--mu);display:block;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ulaz */
.ulaz-slika{position:relative;height:56vh;min-height:420px;max-height:600px;overflow:hidden}
.ulaz-slika img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ulaz-slika .sloj{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,15,12,.30) 0%,rgba(20,15,12,.10) 40%,rgba(20,15,12,.70) 100%)}
.ulaz-slika .vrh{position:absolute;top:28px;left:0;right:0;text-align:center}
.ulaz-slika .dno{position:absolute;left:0;right:0;bottom:44px;text-align:center;padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.ulaz-slika .ozn{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#F4E4C8}
.ulaz-slika .ozn::before,.ulaz-slika .ozn::after{content:'';width:28px;height:1px;background:#D4B07A}
.ulaz-slika h1{color:#fff;font-size:50px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.ulaz-slika h1 em{display:block;text-transform:none;letter-spacing:.01em;font-size:58px}
label.oznaka{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mu)}
input.polje{width:100%;background:transparent;border:0;border-bottom:1px solid var(--st);color:var(--ink);font-size:17px;padding:10px 0;outline:none;border-radius:0}
input.polje:focus{border-bottom-color:var(--go)}
.poruka{background:var(--wg);padding:16px 18px;font-size:14px;line-height:1.7;color:var(--tx)}
.demo-traka{background:var(--pl);color:#fff;font-size:11px;letter-spacing:.08em;text-align:center;padding:7px 12px}

/* meni */
nav.meni{position:fixed;left:0;right:0;bottom:0;background:var(--iv);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav.meni .u{max-width:520px;margin:0 auto;height:80px;display:flex;justify-content:space-around;align-items:center}
nav.meni a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:80px;min-height:48px;text-decoration:none;color:var(--mu);font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
nav.meni a[aria-current="page"]{color:var(--pl)}

/* ---------- raspored: telefon ---------- */
.naslovna{height:var(--v,190px)}
.pozdrav{padding-top:40px;display:flex;flex-direction:column;gap:14px}
.nastavi{margin:36px 24px 0}
.prostorije{padding-top:40px;display:flex;flex-direction:column;gap:12px}
.predlog{margin:32px 24px 0;padding-top:22px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--tx);min-height:44px}
.citat{padding-top:36px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.blok{padding-top:36px}
.modul-glava{padding-top:22px;display:flex;flex-direction:column;gap:30px}
.modul .dve-kolone{padding-top:30px}
.kolona{display:flex;flex-direction:column;gap:30px}
.modul .strana{padding-top:30px}
.dnevnik .stranica{margin:30px 24px 0}
.bib-slika{height:230px;position:relative;overflow:hidden}
.bib-slika img{width:100%;height:100%;object-fit:cover}
.biblioteka .pozdrav{padding-top:36px}
.ulaz-forma{padding-top:36px;display:flex;flex-direction:column;gap:22px}
nav.meni a.meni-logo{display:none}

/* ---------- raspored: računar ---------- */
@media (min-width:960px){
  body{background:var(--iv)}
  nav.meni{top:0;bottom:0;right:auto;width:248px;border-top:0;border-right:1px solid var(--bd);padding:40px 0 0}
  nav.meni .u{height:auto;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:4px;padding:0 20px;max-width:none}
  nav.meni a.meni-logo{display:block;padding:0 12px 40px;font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--pl);font-weight:400}
  nav.meni a:not(.meni-logo){flex-direction:row;justify-content:flex-start;gap:14px;padding:12px;font-size:11px;min-width:0}
  nav.meni a[aria-current="page"]{background:var(--wg)}
  .ekran{max-width:none;margin:0 0 0 248px;padding:0 56px 80px;min-height:100vh}
  .ekran > *{max-width:1120px;margin-left:auto;margin-right:auto}
  .okvir{padding-left:0;padding-right:0}
  .zaglavlje{padding:32px 0 0}
  .zaglavlje .logo{visibility:hidden}
  .demo-traka{margin:0 -56px;max-width:none}
  h1,.h1{font-size:60px}
  h2{font-size:36px}
  .pozdrav{padding-top:28px}

  .soba-mreza{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:48px;align-items:start;margin-top:44px}
  .nastavi{margin:0}
  .naslovna.velika{height:320px}
  .prostorije{padding-top:0}
  .predlog{margin:32px 0 0}

  .dve-kolone{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:56px;align-items:start}
  .strana{position:sticky;top:32px}
  .program .program-vrh{max-width:none;margin:0 -56px}
  .program .naslovna.zaglavna{height:380px}
  .program .dve-kolone{margin-top:44px}
  .program .citat{padding-top:0;text-align:left;align-items:flex-start}
  .program .strana .blok{padding-top:0}
  .mreza3{grid-template-columns:1fr}
  .plocica{min-height:0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:18px 20px}
  .plocica small{margin-top:0}

  .modul-glava{padding-top:32px;gap:24px}
  .modul .dve-kolone{padding-top:40px;padding-left:0;padding-right:0}
  .modul .strana{padding-top:0}
  .pauza{max-width:560px}

  .dnevnik .dve-kolone{margin-top:40px}
  .dnevnik .stranica{margin:0;padding:40px 44px 24px}
  .stranica textarea{min-height:544px;font-size:21px}
  .dnevnik .strana .blok{padding-top:0}

  .bib-slika{height:320px;margin:0 -56px;max-width:none}
  .biblioteka .dve-kolone{margin-top:8px}
  .biblioteka .otvoreno{max-width:820px;margin-left:0}

  .ekran.ulaz{display:grid;grid-template-columns:1.1fr 1fr;margin:0;padding:0;max-width:none;min-height:100vh}
  .ekran.ulaz > *{max-width:none;margin:0}
  .ekran.ulaz .demo-traka{grid-column:1/-1;margin:0}
  .ulaz .ulaz-slika{height:auto;min-height:100vh;max-height:none}
  .ulaz .ulaz-slika h1{font-size:72px} .ulaz .ulaz-slika h1 em{font-size:84px}
  .ulaz .ulaz-forma{align-self:center;justify-self:center;width:100%;max-width:420px;padding:48px 24px}
}

/* ---------- poruka meseca i promocija ---------- */
.poruka-meseca{margin-top:8px;background:var(--wg);border-left:1px solid var(--go);padding:16px 18px;font-size:14.5px;line-height:1.7;color:var(--tx);white-space:pre-line}
.promocija{margin:32px 24px 0;background:var(--wh);display:flex;flex-direction:column}
.promocija img{width:100%;height:170px;object-fit:cover}
.promocija-tekst{padding:22px 22px 24px;display:flex;flex-direction:column;gap:12px}
.promocija h3{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15;color:var(--ink)}

/* ---------- uređivanje ---------- */
.ured-tabovi{display:flex;gap:8px;overflow-x:auto;padding-top:28px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.ured-tabovi a{flex:none;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);text-decoration:none;border:1px solid var(--bd);padding:12px 16px;min-height:44px;display:flex;align-items:center;background:var(--wh)}
.ured-tabovi a[aria-current="page"]{background:var(--pl);border-color:var(--pl);color:#fff}
#ured-sadrzaj{padding-top:28px}
.ured-blok{background:var(--wh);padding:24px 22px;margin-bottom:16px;display:flex;flex-direction:column;gap:14px}
.ured-blok.tiho-zlato{border-left:1px solid var(--go)}
.forma-ured{display:flex;flex-direction:column;gap:18px}
.polje-ured{display:flex;flex-direction:column;gap:6px;border:0}
.polje-ured label,.polje-ured legend{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);margin-bottom:2px}
.polje-ured input,.polje-ured textarea,.polje-ured select{width:100%;border:1px solid var(--bd);background:var(--iv);padding:12px 14px;font-family:var(--sans);font-weight:300;font-size:15px;color:var(--ink);border-radius:0;min-height:46px}
.polje-ured textarea{line-height:1.7;resize:vertical}
.polje-ured input:focus,.polje-ured textarea:focus,.polje-ured select:focus{outline:none;border-color:var(--go)}
.polje-ured .cek{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);min-height:40px}
.polje-ured .cek input{width:18px;height:18px;min-height:0;accent-color:var(--pl)}
.dva-polja{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ured-red{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--bd);font-size:14px;color:var(--ink);line-height:1.5}
.ured-red.kolona-red{flex-direction:column;gap:8px}
.cipovi{display:flex;flex-wrap:wrap;gap:8px}
.cip{border:1px solid var(--bd);background:var(--iv);color:var(--mu);font-size:12.5px;padding:10px 14px;min-height:40px;cursor:pointer}
.cip.uklj{border-color:var(--pl);color:var(--pl);background:var(--wh)}
.ured-brojevi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.broj-kartica{background:var(--wh);padding:18px;display:flex;flex-direction:column;gap:6px}
.broj-kartica strong{font-family:var(--serif);font-weight:300;font-size:38px;line-height:1;color:var(--pl)}
.modul-ured{border-bottom:1px solid var(--bd)}
.modul-ured summary{cursor:pointer;padding:16px 0;font-family:var(--serif);font-size:20px;color:var(--ink);list-style:none;min-height:44px}
.modul-ured summary::-webkit-details-marker{display:none}
.modul-ured summary .broj{font-style:italic;color:var(--mu);display:inline-block;width:40px}
.modul-ured[open] summary{color:var(--pl)}
.modul-ured .forma-ured{padding:4px 0 20px}
.ured-sacuvaj{position:sticky;bottom:96px;padding:12px 0}
.javi{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;font-size:13px;padding:0;max-width:90vw;text-align:center;z-index:5}
.javi:not(:empty){padding:12px 18px}
.javi.greska{background:#8a2f2f}
@media (min-width:960px){
  .promocija{margin:32px 0 0}
  .ured-tabovi{padding-top:32px}
  .ured-brojevi{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ured .okvir{max-width:860px;margin-left:0}
  .ured-sacuvaj{bottom:0}
  .javi{bottom:110px;left:calc(50% + 124px)}
}

.vidljivo-citacu{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .red.zakljucan{opacity:.55;cursor:default}
  .red.zakljucan .status{font-style:italic}
  .ulaz-ili{display:flex;align-items:center;gap:12px;color:var(--mu);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px}
  .ulaz-ili::before,.ulaz-ili::after{content:"";flex:1;height:1px;background:var(--bd)}
  /* ponuda */
  .ponuda-lista{display:flex;flex-direction:column;gap:14px;padding-top:8px}
  .ponuda-kartica{display:flex;align-items:center;gap:18px;background:var(--wh);padding:14px;text-decoration:none;color:inherit;border:1px solid transparent;transition:border-color .2s}
  .ponuda-kartica:hover{border-color:var(--bd)}
  .ponuda-kartica img{width:96px;height:96px;object-fit:cover;flex:none}
  .ponuda-tekst{flex:1;display:flex;flex-direction:column;gap:6px}
  .ponuda-tekst .ime{font-family:var(--serif);font-size:24px;color:var(--ink)}
  .ponuda-tekst .cena,.cena-velika{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--go)}
  .cena-velika{font-family:var(--serif);font-size:34px;letter-spacing:0;text-transform:none;color:var(--ink)}
  .ponuda-slika img{width:100%;height:260px;object-fit:cover;display:block}
  .ponuda-kupi{background:var(--wh);padding:24px;display:flex;flex-direction:column;gap:14px}
  .ponuda-dobijas{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--tx);line-height:1.6}
  .ponuda-koraci{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mu);line-height:1.6}
  .ponuda section{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
  .ponuda .pozdrav{margin-bottom:12px}
  @media (max-width:959px){
